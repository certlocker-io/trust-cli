version: 2

project_name: trust

builds:
  - id: trust
    main: ./cmd/trust
    binary: trust
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/certlocker-io/trust-cli/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    files:
      - README.md
      - LICENSE
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true
